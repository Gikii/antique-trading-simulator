# =====================================================================================
#  MINOR EVENT PROPOSALS — Antique Trading Simulator
# =====================================================================================
#
#  One block per event. Field names match EventDefinition and the EventEffect classes,
#  so each block can be copied straight into an asset in the Inspector (or read by an
#  importer later). Enums are written by NAME, not by number.
#
#  Fields that are not listed take the class default:
#    EventType: Minor · Annual: false · FailureChance: 0 · CanBeFakeNews: true
#    CreateOfficialNews: true · OfficialAnnouncementWeeksBefore: 1
#    CreateRumour: false · RumorCredibility: 0.5 · CreateLeak: false · LeakCredibility: 0.9
#
#  "Tendency" is NOT an engine field. It's a design note on the overall price direction
#  (Up / Down / Mixed / Opportunity) to help with balancing. Delete it on import.
#
#  Descriptions use the existing {present|future} token syntax (TextHelper.Resolve).
#
#  Antiques are only ever collected, never used: effects are driven by collectors,
#  dealers, fashion, scholarship, sales or transport, not by an object's practical use.
#  The one exception is intrinsic material value. Precious metal is worth its weight
#  whatever the object, so bullion prices may move coins, silverware and jewellery.
#
# -------------------------------------------------------------------------------------
#  QUICK REFERENCE
# -------------------------------------------------------------------------------------
#  AntiqueType : Clock Vase Furniture Painting Sculpture Jewelry Coin Book Rug Silverware
#                Ceramic Porcelain Mirror Lamp Weapon Instrument Textile Toy   (Other = any)
#  Country     : England France Italy Germany Spain Portugal Netherlands Austria Russia
#                China Japan India Turkey UnitedStates Poland                  (Other = any)
#  Century     : XII XIII XIV XV XVI XVII XVIII XIX XX                        (Unknown = any)
#  Seasons     : All, or any list of Spring Summer Autumn Winter
#  ShippingZone: Local Domestic International
#
#  ChangeDemandEffect      Scope (AntiqueType|Country|Century) + matching field,
#                          tempDemandChange, permDemandChange
#  ChangeSupplyEffect      Scope + matching field, tempSupplyChange, permSupplyChange
#  CreateAntiqueOnMarketEventEffect
#                          MinCount, MaxCount, AntiqueType, Country, Century,
#                          Condition (0 = roll, else 0.3–1.0), PriceFactor (0 = roll, else 0.7–1.25),
#                          RandomizeShippingZone, ShippingZone, AddSupplyPressure
#  CreateContractEventEffect
#                          MinCount, MaxCount, Scope (Random|AntiqueType|Country|Century) + field,
#                          Quantity (0 = roll), MinCondition (0 = roll, else 0–1.0),
#                          DurationWeeks (0 = roll), RewardPerUnit (0 = normal),
#                          Type (Random|Open|Exclusive), Penalty (-1 = auto),
#                          ClassName ("" = rolled, Standard, Premium, Prestige),
#                          RequiredReputation (-1 = from class)
#  TransportDelayEffect    Zone, NewShipmentDelayWeeks, InTransitDelayWeeks
#
#  Effect magnitudes follow the existing assets: temp ±0.5–2.5, perm ±0.25–0.75.
#  Event durations: long 5–6 weeks, medium 3–4, short 1–2.
# =====================================================================================

Events:

